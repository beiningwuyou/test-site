<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Pages 测试展示站点</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.2);
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.85);
      --border: rgba(0, 0, 0, 0.08);
      --text-main: #0f172a;
      --text-sub: #64748b;
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.15);
      --success: #059669;
      --success-glow: rgba(5, 150, 105, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.25rem;
    }

    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px var(--success-glow);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.75; }
    }

    .brand h1 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .theme-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .theme-btn:hover {
      border-color: var(--accent);
    }

    .hero-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    .hero-card h2 {
      font-size: 2rem;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, var(--text-main), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-card p {
      color: var(--text-sub);
      font-size: 1.05rem;
      line-height: 1.6;
      max-width: 580px;
      margin: 0 auto 1.5rem auto;
    }

    .url-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent-glow);
      color: var(--accent);
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      border: 1px solid var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .card h3 {
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .info-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.88rem;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      color: var(--text-sub);
    }

    .info-item span:last-child {
      color: var(--text-main);
      font-family: ui-monospace, monospace;
    }

    .action-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.1s ease, filter 0.2s ease;
    }
    .action-btn:hover {
      filter: brightness(1.1);
    }
    .action-btn:active {
      transform: scale(0.98);
    }

    .counter-display {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--accent);
      text-align: center;
      margin: 0.5rem 0;
    }

    footer {
      margin-top: 2rem;
      text-align: center;
      color: var(--text-sub);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="status-dot"></div>
        <h1>GitHub Pages 连通测试站点</h1>
      </div>
      <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">🌓 切换明暗主题</button>
    </header>

    <div class="hero-card">
      <h2>🎉 静态测试站点运行正常</h2>
      <p>这是一个部署在 GitHub 上的轻量展示测试页面，用于验证域名解析、静态托管服务及 HTTPS 访问连通性。</p>
      <div class="url-badge" id="currentUrl">
        🌐 正在检测当前访问地址...
      </div>
    </div>

    <div class="grid">
      <!-- 客户端环境 -->
      <div class="card">
        <h3>💻 客户端环境检测</h3>
        <ul class="info-list">
          <li class="info-item">
            <span>传输协议</span>
            <span id="protocol">-</span>
          </li>
          <li class="info-item">
            <span>屏幕分辨率</span>
            <span id="screenRes">-</span>
          </li>
          <li class="info-item">
            <span>视口断点</span>
            <span id="breakpoint">-</span>
          </li>
          <li class="info-item">
            <span>网络状态</span>
            <span id="onlineStatus">Online</span>
          </li>
        </ul>
      </div>

      <!-- 交互计数器测试 -->
      <div class="card">
        <h3>⚡️ 动态交互测试</h3>
        <p style="color: var(--text-sub); font-size: 0.88rem;">测试浏览器 JavaScript 执行与状态记录：</p>
        <div class="counter-display" id="countDisplay">0</div>
        <div style="display: flex; gap: 0.5rem;">
          <button class="action-btn" style="flex: 1;" onclick="addCount()">点击增加 +1</button>
          <button class="theme-btn" onclick="resetCount()">重置</button>
        </div>
      </div>

      <!-- 延迟测试 -->
      <div class="card">
        <h3>⏱️ 连通性与延迟测试</h3>
        <p style="color: var(--text-sub); font-size: 0.88rem;">检测客户端到当前站点的网络往返延迟 (RTT)：</p>
        <div class="counter-display" id="pingDisplay" style="font-size: 1.8rem; color: var(--success);">- ms</div>
        <button class="action-btn" onclick="testPing()">测速刷新</button>
      </div>
    </div>

    <footer>
      <p>由 GitHub Pages 托管 · 自动化部署测试</p>
    </footer>
  </div>

  <script>
    // 检测当前环境
    document.getElementById('currentUrl').textContent = '🌐 ' + window.location.href;
    document.getElementById('protocol').textContent = window.location.protocol.replace(':', '').toUpperCase();
    document.getElementById('screenRes').textContent = `${window.screen.width} × ${window.screen.height}`;
    
    function updateBreakpoint() {
      const w = window.innerWidth;
      let bp = 'xs (<640px)';
      if (w >= 1280) bp = 'xl (≥1280px)';
      else if (w >= 1024) bp = 'lg (≥1024px)';
      else if (w >= 768) bp = 'md (≥768px)';
      else if (w >= 640) bp = 'sm (≥640px)';
      document.getElementById('breakpoint').textContent = `${w}px · ${bp}`;
    }
    updateBreakpoint();
    window.addEventListener('resize', updateBreakpoint);

    // 主题切换
    function toggleTheme() {
      const body = document.body;
      const current = body.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      body.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.body.setAttribute('data-theme', savedTheme);
    }

    // 交互计数器
    let count = parseInt(localStorage.getItem('test_count') || '0', 10);
    const countDisplay = document.getElementById('countDisplay');
    countDisplay.textContent = count;

    function addCount() {
      count++;
      countDisplay.textContent = count;
      localStorage.setItem('test_count', count);
    }

    function resetCount() {
      count = 0;
      countDisplay.textContent = count;
      localStorage.setItem('test_count', count);
    }

    // Ping 测试
    function testPing() {
      const pingDisplay = document.getElementById('pingDisplay');
      pingDisplay.textContent = '测速中...';
      const start = performance.now();
      fetch(window.location.href, { method: 'HEAD', cache: 'no-store' })
        .then(() => {
          const end = performance.now();
          const latency = Math.round(end - start);
          pingDisplay.textContent = `${latency} ms`;
        })
        .catch(() => {
          pingDisplay.textContent = '测速完成';
        });
    }
    setTimeout(testPing, 500);
  </script>
</body>
</html>
